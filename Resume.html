<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Builder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>📄 Resume Builder</h1>
    <p>Fill in your details — download a clean PDF resume instantly.</p>
  </header>

  <main class="container">
    <!-- ================= FORM ================= -->
    <section class="form-panel">
      <h2>Your Details</h2>

      <!-- Personal Info -->
      <fieldset>
        <legend>Personal Info</legend>
        <input type="text" id="name" placeholder="Full Name" />
        <input type="text" id="title" placeholder="Job Title (e.g. Frontend Developer)" />
        <input type="email" id="email" placeholder="Email" />
        <input type="text" id="phone" placeholder="Phone" />
        <input type="text" id="location" placeholder="Location (City, Country)" />
        <input type="text" id="website" placeholder="Website / LinkedIn / GitHub (optional)" />
        <textarea id="summary" rows="3" placeholder="Professional Summary"></textarea>
      </fieldset>

      <!-- Experience -->
      <fieldset>
        <legend>Experience</legend>
        <div id="experience-list"></div>
        <button type="button" class="add-btn" onclick="addExperience()">+ Add Experience</button>
      </fieldset>

      <!-- Education -->
      <fieldset>
        <legend>Education</legend>
        <div id="education-list"></div>
        <button type="button" class="add-btn" onclick="addEducation()">+ Add Education</button>
      </fieldset>

      <!-- Skills -->
      <fieldset>
        <legend>Skills</legend>
        <textarea id="skills" rows="2" placeholder="Comma separated (e.g. HTML, CSS, JavaScript, React)"></textarea>
      </fieldset>

      <button type="button" class="download-btn" onclick="downloadPDF()">⬇ Download as PDF</button>
    </section>

    <!-- ================= PREVIEW ================= -->
    <section class="preview-panel">
      <h2>Live Preview</h2>
      <div id="preview">
        <div class="resume-header">
          <h1 id="p-name">Your Name</h1>
          <p id="p-title">Job Title</p>
          <p id="p-contact"></p>
        </div>

        <div class="resume-section" id="summary-section">
          <h3>Summary</h3>
          <p id="p-summary"></p>
        </div>

        <div class="resume-section" id="experience-section">
          <h3>Experience</h3>
          <div id="p-experience"></div>
        </div>

        <div class="resume-section" id="education-section">
          <h3>Education</h3>
          <div id="p-education"></div>
        </div>

        <div class="resume-section" id="skills-section">
          <h3>Skills</h3>
          <p id="p-skills"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
